server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: citycare-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citycare_db}
    username: ${SPRING_DATASOURCE_USERNAME:sujal6067}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

citycare:
  security:
    jwt:
      secret: ${JWT_SECRET:4a6f8b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a}
      access-token-expiration-ms: 86400000 # 24 hours
      refresh-token-expiration-ms: 604800000 # 7 days
app:
  base-url: ${APP_BASE_URL:http://localhost:5173}

sms:
  enabled: ${SMS_ENABLED:false}
  api-key: ${SMS_API_KEY:}
  sender-id: ${SMS_SENDER_ID:HEALTH}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    com.citycare.platform: INFO
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: prod
citycare:
  security:
    jwt:
      secret: ${JWT_SECRET}
admin:
  default-password: ${SUPERADMIN_PASSWORD}
